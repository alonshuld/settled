<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0C0F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Split group expenses and always know who owes whom." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>שולם · Settled</title>
    <script>
      // Apply locale + theme before first paint to avoid a flash.
      (function () {
        try {
          var lang = localStorage.getItem('settled.lang') || 'he';
          var theme = localStorage.getItem('settled.theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.lang = lang;
          el.dir = lang === 'he' ? 'rtl' : 'ltr';
          el.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
