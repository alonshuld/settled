<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Phone — group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--pos:#0A7A4F;--pos-bg:#E2F4EB;--neg:#BF3F0B;--neg-bg:#FCECE3;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--pos:#4BDB98;--pos-bg:#0F2A1E;--neg:#FF9568;--neg-bg:#2D1911}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.seg{font:inherit;font-size:15px;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer;flex:1}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.icon-btn:focus-visible,.seg:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 0">
    <a class="icon-btn" href="PhoneHome.dc.html" aria-label="{{t.back}}"><svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
    <button class="icon-btn" aria-label="{{t.invite}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6M22 11h-6"/><circle cx="9" cy="7" r="4"/></svg></button>
  </div>

  <div style="padding: 16px 20px 0; display: flex; align-items: center; gap: 14px">
    <span style="width: 56px; height: 56px; border-radius: 17px; background: #9CC8FF; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">{{t.group}}</h1>
      <span style="font-size: 13px; color: var(--muted)">{{t.meta}}</span>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: flex; gap: 10px">
    <div style="flex: 1; padding: 12px 14px; border-radius: 16px; background: var(--pos-bg); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--pos); font-weight: 500">{{t.owed}}</span><span style="font-size: 22px; font-weight: 700; color: var(--pos)">₪1,800</span></div>
    <div style="flex: 1; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">{{t.total}}</span><span style="font-size: 22px; font-weight: 700">₪10,000</span></div>
  </div>

  <div role="tablist" style="margin: 16px 20px 0; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line)">
    <button role="tab" class="seg {{tabExp}}" onClick="{{showExp}}" aria-selected="{{selExp}}">{{t.expenses}}</button>
    <button role="tab" class="seg {{tabBal}}" onClick="{{showBal}}" aria-selected="{{selBal}}">{{t.balances}}</button>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 8px 12px 0">
    <sc-if value="{{isExp}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{items}}" as="x" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 8px">
            <span style="width: 40px; height: 40px; border-radius: 12px; background: {{x.tint}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.d}}"/></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{x.title}}</span><span style="font-size: 12px; color: var(--muted)">{{x.meta}}</span></span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{x.amount}}</span><span style="font-size: 12px; font-weight: 500; color: {{x.effColor}}">{{x.eff}}</span></span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isBal}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 8px">
        <sc-for list="{{bal}}" as="b" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)">
            <span style="width: 38px; height: 38px; border-radius: 999px; background: {{b.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{b.i}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 15px; font-weight: 500">{{b.name}}</span>
              <span style="height: 6px; border-radius: 999px; background: var(--surface2); overflow: hidden; display: flex"><span style="width: {{b.w}}; background: {{b.color}}; border-radius: 999px"></span></span>
            </span>
            <span style="font-size: 15px; font-weight: 700; color: {{b.color}}">{{b.label}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 20px 30px; background: var(--bg); border-top: 1px solid var(--line)">
    <a href="PhoneSettle.dc.html" style="flex: 1; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>{{t.settle}}</a>
    <a href="PhoneAdd.dc.html" style="flex: 1.3; min-height: 54px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>{{t.add}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : (this.props.dark ?? true);
    const he = lang === 'he';
    const T = {
      he: { langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', back: 'חזרה', invite: 'הזמנת חברים',
        group: 'טיול לכרתים', meta: '12–18 באוק׳ · 4 חברים', owed: 'חייבים לך', total: 'סה״כ הוצאות',
        expenses: 'הוצאות', balances: 'מאזנים', settle: 'סגירת חשבון', add: 'הוצאה חדשה' },
      en: { langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', back: 'Back', invite: 'Invite friends',
        group: 'Crete trip', meta: 'Oct 12–18 · 4 members', owed: 'You’re owed', total: 'Total spent',
        expenses: 'Expenses', balances: 'Balances', settle: 'Settle up', add: 'Add expense' }
    };
    const t = he ? T.he : T.en;
    const ic = {
      pay: 'M5 12.5l4.5 4.5L19 7.5',
      boat: 'M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M4 14l2-5h12l2 5M12 9V3l5 4h-5',
      cart: 'M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6',
      food: 'M5 3v8a2 2 0 0 0 2 2v8M9 3v8M7 3v8M17 21V3c-2 0-3 2-3 5v5h3',
      car: 'M3 17v-4l2-6h14l2 6v4H3zM3 13h18M7 17v2M17 17v2',
      bed: 'M3 18V7M3 13h18v5M21 18v-5a3 3 0 0 0-3-3h-7v3'
    };
    const pos = 'var(--pos)', neg = 'var(--neg)', mut = 'var(--muted)';
    const items = he ? [
      { title: 'מאיה העבירה לך', meta: '19 באוק׳ · ביט', amount: '₪500', eff: 'התקבל', effColor: pos, tint: '#C6F135', d: ic.pay },
      { title: 'שייט לבלוס', meta: 'מאיה שילמה · 16 באוק׳', amount: '₪1,360', eff: 'חלקך ₪340', effColor: neg, tint: '#9EE6CF', d: ic.boat },
      { title: 'קניות בסופר', meta: 'איתי שילם · 15 באוק׳', amount: '₪480', eff: 'חלקך ₪120', effColor: neg, tint: '#FFB59A', d: ic.cart },
      { title: 'ארוחה בטברנה', meta: 'איתי שילם · 14 באוק׳', amount: '₪1,120', eff: 'חלקך ₪280', effColor: neg, tint: '#FFB59A', d: ic.food },
      { title: 'השכרת רכב', meta: 'נועה שילמה · 13 באוק׳', amount: '₪1,600', eff: 'חלקך ₪400', effColor: neg, tint: '#FFE08A', d: ic.car },
      { title: 'מלון בחאניה', meta: 'את/ה שילמת · 12 באוק׳', amount: '₪4,800', eff: 'הלווית ₪3,600', effColor: pos, tint: '#9CC8FF', d: ic.bed }
    ] : [
      { title: 'Maya paid you', meta: 'Oct 19 · Bit', amount: '₪500', eff: 'received', effColor: pos, tint: '#C6F135', d: ic.pay },
      { title: 'Boat tour to Balos', meta: 'Maya paid · Oct 16', amount: '₪1,360', eff: 'your share ₪340', effColor: neg, tint: '#9EE6CF', d: ic.boat },
      { title: 'Groceries', meta: 'Itay paid · Oct 15', amount: '₪480', eff: 'your share ₪120', effColor: neg, tint: '#FFB59A', d: ic.cart },
      { title: 'Taverna dinner', meta: 'Itay paid · Oct 14', amount: '₪1,120', eff: 'your share ₪280', effColor: neg, tint: '#FFB59A', d: ic.food },
      { title: 'Car rental', meta: 'Noa paid · Oct 13', amount: '₪1,600', eff: 'your share ₪400', effColor: neg, tint: '#FFE08A', d: ic.car },
      { title: 'Hotel in Chania', meta: 'You paid · Oct 12', amount: '₪4,800', eff: 'you lent ₪3,600', effColor: pos, tint: '#9CC8FF', d: ic.bed }
    ];
    const bal = he ? [
      { name: 'אלון (את/ה)', i: 'א', c: '#C6F135', w: '100%', label: '+₪1,800', color: pos },
      { name: 'נועה', i: 'נ', c: '#FFB59A', w: '50%', label: '−₪900', color: neg },
      { name: 'איתי', i: 'א', c: '#9CC8FF', w: '50%', label: '−₪900', color: neg },
      { name: 'מאיה', i: 'מ', c: '#E2B6FF', w: '0%', label: 'שולם ✓', color: mut }
    ] : [
      { name: 'Alon (you)', i: 'A', c: '#C6F135', w: '100%', label: '+₪1,800', color: pos },
      { name: 'Noa', i: 'N', c: '#FFB59A', w: '50%', label: '−₪900', color: neg },
      { name: 'Itay', i: 'I', c: '#9CC8FF', w: '50%', label: '−₪900', color: neg },
      { name: 'Maya', i: 'M', c: '#E2B6FF', w: '0%', label: 'Settled ✓', color: mut }
    ];
    const tab = s.tab || 'exp';
    return {
      t, items, bal,
      isExp: tab === 'exp', isBal: tab === 'bal',
      tabExp: tab === 'exp' ? 'on' : '', tabBal: tab === 'bal' ? 'on' : '',
      selExp: tab === 'exp' ? 'true' : 'false', selBal: tab === 'bal' ? 'true' : 'false',
      showExp: () => this.setState({ tab: 'exp' }), showBal: () => this.setState({ tab: 'bal' }),
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
