<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Phone — settle and remind</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--pos:#0A7A4F;--pos-bg:#E2F4EB;--neg:#BF3F0B;--neg-bg:#FCECE3;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--pos:#4BDB98;--pos-bg:#0F2A1E;--neg:#FF9568;--neg-bg:#2D1911}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.sbtn{font:inherit;font-weight:600;font-size:14px;border-radius:12px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:0;background:var(--ink);color:var(--bg)}
.chip{font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon-btn:focus-visible,.sbtn:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; position: relative">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 0">
    <a class="icon-btn" href="PhoneGroup.dc.html" aria-label="{{t.back}}"><svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">{{t.title}}</h1>
    <span style="font-size: 14px; color: var(--muted)">{{t.sub}}</span>
  </div>

  <div style="margin: 16px 20px 0; padding: 16px 18px; border-radius: 20px; background: #0E1116; border: 1px solid #262B33; color: #F2F3F5; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #AEB5C0">{{t.left}}</span>
    <span style="font-size: 32px; font-weight: 700; color: #C6F135">₪1,800</span>
    <span style="height: 8px; border-radius: 999px; background: #262B33; display: flex; overflow: hidden"><span style="width: 22%; background: #C6F135; border-radius: 999px"></span></span>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{xfers}}" as="x" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
        <span style="width: 42px; height: 42px; border-radius: 999px; background: {{x.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">{{x.i}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">{{x.text}}</span><span style="font-size: 18px; font-weight: 700">{{x.amount}}</span></span>
        <sc-if value="{{x.open}}" hint-placeholder-val="{{true}}"><button class="sbtn" onClick="{{x.remind}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>{{t.remind}}</button></sc-if>
        <sc-if value="{{x.done}}" hint-placeholder-val="{{false}}"><span style="transform: rotate(-7deg); border: 2px solid var(--pos); color: var(--pos); border-radius: 10px; padding: 2px 10px; font-size: 15px; font-weight: 800">{{t.stamp}}</span></sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; justify-content: flex-end">
      <button onClick="{{close}}" aria-label="{{t.close}}" style="flex: 1; background: transparent; border: 0; cursor: pointer"></button>
      <div role="dialog" aria-label="{{sheetTitle}}" style="background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px">
        <span style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 42px; height: 42px; border-radius: 999px; background: {{sel.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">{{sel.i}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 18px">{{sheetTitle}}</span><span style="font-size: 13px; color: var(--muted)">{{sel.last}}</span></span>
          <button class="icon-btn" onClick="{{close}}" aria-label="{{t.close}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{tones}}" as="o" hint-placeholder-count="3"><button class="chip {{o.on}}" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}">{{o.label}}</button></sc-for>
        </div>
        <div style="padding: 14px 16px; border-radius: 18px; border-start-start-radius: 6px; background: var(--surface2); border: 1px solid var(--line); font-size: 15px; line-height: 1.55">{{message}}</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{t.auto}}
        </div>
        <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
          <button onClick="{{send}}" style="font: inherit; min-height: 56px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; cursor: pointer"><svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>{{t.sendWa}}</button>
        </sc-if>
        <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
          <div style="min-height: 56px; border-radius: 16px; background: var(--pos-bg); color: var(--pos); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{t.sentLabel}}</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":true},"sheetOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : (this.props.dark ?? true);
    const sheet = s.sheet != null ? s.sheet : (this.props.sheetOpen ?? true);
    const he = lang === 'he';
    const T = {
      he: { langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', back: 'חזרה', close: 'סגירה',
        title: 'סגירת חשבון', sub: 'טיול לכרתים · 3 העברות במקום 6', left: 'עוד מגיע לך', remind: 'תזכורת', stamp: 'שולם',
        auto: 'תזכורת חוזרת אוטומטית כל 3 ימים', sendWa: 'שליחה ב־WhatsApp', sentLabel: 'נשלח!', tones: ['חברי', 'עניני', 'נחרץ'] },
      en: { langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', back: 'Back', close: 'Close',
        title: 'Settle up', sub: 'Crete trip · 3 transfers instead of 6', left: 'Still owed to you', remind: 'Remind', stamp: 'Settled',
        auto: 'Auto-repeat every 3 days', sendWa: 'Send on WhatsApp', sentLabel: 'Sent!', tones: ['Friendly', 'Neutral', 'Firm'] }
    };
    const t = he ? T.he : T.en;
    const P = he
      ? [{ name: 'נועה', i: 'נ', c: '#FFB59A', f: true, last: 'עוד לא נשלחה תזכורת' }, { name: 'איתי', i: 'א', c: '#9CC8FF', f: false, last: 'תזכורת אחרונה לפני יומיים' }]
      : [{ name: 'Noa', i: 'N', c: '#FFB59A', last: 'No reminder sent yet' }, { name: 'Itay', i: 'I', c: '#9CC8FF', last: 'Last reminded 2 days ago' }];
    const selIdx = s.sel ?? 0;
    const xfers = [
      { i: P[0].i, c: P[0].c, text: he ? 'נועה חייבת לך' : 'Noa owes you', amount: '₪900', open: true, done: false, remind: () => this.setState({ sel: 0, sheet: true, sent: false }) },
      { i: P[1].i, c: P[1].c, text: he ? 'איתי חייב לך' : 'Itay owes you', amount: '₪900', open: true, done: false, remind: () => this.setState({ sel: 1, sheet: true, sent: false }) },
      { i: he ? 'מ' : 'M', c: '#E2B6FF', text: he ? 'מאיה העבירה לך' : 'Maya paid you', amount: '₪500', open: false, done: true, remind: () => {} }
    ];
    const sp = P[selIdx];
    const tone = s.tone ?? 0;
    const tones = t.tones.map((label, i) => ({ label, on: i === tone ? 'on' : '', pressed: i === tone ? 'true' : 'false', pick: () => this.setState({ tone: i, sent: false }) }));
    const msgs = he ? [
      'היי ' + sp.name + '! תזכורת קטנה מהטיול לכרתים — נשאר להעביר לאלון ₪900. אפשר בביט, הקישור כאן. תודה!',
      'שלום ' + sp.name + ', לפי ההתחשבנות ב״טיול לכרתים״ נשארה יתרה של ₪900 לאלון. פרטי התשלום מצורפים.',
      sp.name + ', עדיין פתוחים ₪900 לאלון מהטיול. אשמח שתסגור/י את זה עד סוף השבוע.'
    ] : [
      'Hey ' + sp.name + '! Quick nudge from the Crete trip — you still owe Alon ₪900. Bit link’s right here. Thanks!',
      'Hi ' + sp.name + ', per “Crete trip” there’s ₪900 owed to Alon. Payment details attached.',
      sp.name + ', ₪900 to Alon from the trip is still open. Please settle it by the end of the week.'
    ];
    const sent = !!s.sent;
    return {
      t, xfers, tones, sheet,
      sel: { i: sp.i, c: sp.c, last: sp.last },
      sheetTitle: he ? 'תזכורת ל' + sp.name : 'Remind ' + sp.name,
      message: msgs[tone], sent, notSent: !sent,
      send: () => this.setState({ sent: true }),
      close: () => this.setState({ sheet: false }),
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
