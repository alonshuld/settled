<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--pos:#0A7A4F;--neg:#BF3F0B;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--pos:#4BDB98;--neg:#FF9568}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.chip{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:500;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.payer{font:inherit;color:var(--ink);background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;padding:0;flex:1}
.payer .ring{width:54px;height:54px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:2.5px solid transparent;padding:3px}
.payer.on .ring{border-color:var(--ink)}
.prow{font:inherit;color:var(--ink);background:transparent;border:0;width:100%;display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;text-align:start;min-height:52px}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#0E1116}
.icon-btn:focus-visible,.chip:focus-visible,.payer:focus-visible,.prow:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 0">
    <a class="icon-btn" href="PhoneGroup.dc.html" aria-label="{{t.close}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center"><span style="font-weight: 600; font-size: 16px">{{t.title}}</span><span style="font-size: 12px; color: var(--muted)">{{t.group}}</span></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>

  <div dir="ltr" style="display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 22px 0 4px">
    <span style="font-size: 30px; color: var(--muted); font-weight: 500">₪</span>
    <label for="pamt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.amount}}</label>
    <input id="pamt" inputmode="decimal" value="{{amountStr}}" onInput="{{onAmount}}" style="font: inherit; font-size: 60px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); background: transparent; border: 0; width: 190px; text-align: center; outline: none">
  </div>
  <div style="padding: 0 20px">
    <label for="pdesc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.what}}</label>
    <input id="pdesc" value="{{t.desc}}" style="font: inherit; font-size: 17px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 50px; padding: 0 16px; width: 100%; text-align: center">
  </div>

  <div style="display: flex; gap: 8px; padding: 14px 20px 0; overflow: hidden">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button class="chip {{c.on}}" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg>{{c.label}}</button></sc-for>
  </div>

  <div style="margin: 16px 20px 0; padding: 14px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 500; color: var(--muted); padding: 0 4px">{{t.paidBy}}</span>
    <div style="display: flex">
      <sc-for list="{{payers}}" as="p" hint-placeholder-count="4">
        <button class="payer {{p.on}}" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}"><span class="ring"><span style="width: 100%; height: 100%; border-radius: 999px; background: {{p.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">{{p.i}}</span></span>{{p.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin: 12px 20px 0; padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px"><span style="font-size: 13px; font-weight: 500; color: var(--muted)">{{t.split}}</span><span style="font-size: 13px; font-weight: 600">{{t.equally}}</span></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button class="prow" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}">
        <span class="chk {{r.chk}}"><sc-if value="{{r.inc}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
        <span style="flex: 1; font-size: 15px; font-weight: 500">{{r.name}}</span>
        <span style="font-size: 15px; font-weight: 600; color: {{r.color}}">{{r.share}}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 12px 20px 30px">
    <a href="PhoneGroup.dc.html" style="min-height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px">{{saveLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"en"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'en';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    const T = {
      he: { langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', close: 'סגירה',
        title: 'הוצאה חדשה', group: 'טיול לכרתים', amount: 'סכום', what: 'על מה?', desc: 'קוקטיילים בשקיעה',
        paidBy: 'מי שילם?', split: 'חלוקה', equally: 'שווה בשווה', you: 'את/ה', out: '—', save: 'שמירה',
        cats: ['אוכל', 'לינה', 'תחבורה', 'אטרקציות', 'אחר'] },
      en: { langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', close: 'Close',
        title: 'New expense', group: 'Crete trip', amount: 'Amount', what: 'What for?', desc: 'Sunset cocktails',
        paidBy: 'Who paid?', split: 'Split', equally: 'Equally', you: 'You', out: '—', save: 'Save',
        cats: ['Food', 'Stay', 'Transport', 'Activities', 'Other'] }
    };
    const t = he ? T.he : T.en;
    const D = ['M5 3v8a2 2 0 0 0 2 2v8M9 3v8M7 3v8M17 21V3c-2 0-3 2-3 5v5h3', 'M3 18V7M3 13h18v5M21 18v-5a3 3 0 0 0-3-3h-7v3', 'M3 17v-4l2-6h14l2 6v4H3zM3 13h18M7 17v2M17 17v2', 'M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M4 14l2-5h12l2 5', 'M12 12h.01M19 12h.01M5 12h.01'];
    const cat = s.cat ?? 0;
    const cats = t.cats.map((label, i) => ({ label, d: D[i], on: i === cat ? 'on' : '', pressed: i === cat ? 'true' : 'false', pick: () => this.setState({ cat: i }) }));
    const ppl = he
      ? [{ name: 'אלון', i: 'א', c: '#C6F135' }, { name: 'נועה', i: 'נ', c: '#FFB59A' }, { name: 'איתי', i: 'א', c: '#9CC8FF' }, { name: 'מאיה', i: 'מ', c: '#E2B6FF' }]
      : [{ name: 'Alon', i: 'A', c: '#C6F135' }, { name: 'Noa', i: 'N', c: '#FFB59A' }, { name: 'Itay', i: 'I', c: '#9CC8FF' }, { name: 'Maya', i: 'M', c: '#E2B6FF' }];
    const payer = s.payer ?? 0;
    const payers = ppl.map((p, i) => ({ ...p, name: i === 0 ? t.you : p.name, on: i === payer ? 'on' : '', pressed: i === payer ? 'true' : 'false', pick: () => this.setState({ payer: i }) }));
    const amountStr = s.amount != null ? s.amount : '360';
    const amount = parseFloat(String(amountStr).replace(/,/g, '')) || 0;
    const fmt = (n) => '₪' + (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
    const inc = s.inc || [true, true, true, true];
    const n = inc.filter(Boolean).length || 1;
    const rows = ppl.map((p, i) => ({
      name: i === 0 ? t.you : p.name, inc: inc[i], chk: inc[i] ? 'on' : '', pressed: inc[i] ? 'true' : 'false',
      share: inc[i] ? fmt(amount / n) : t.out, color: inc[i] ? 'var(--ink)' : 'var(--muted)',
      toggle: () => { const x = inc.slice(); x[i] = !x[i]; this.setState({ inc: x }); }
    }));
    return {
      t, cats, payers, rows, amountStr,
      saveLabel: t.save + ' · ' + fmt(amount),
      onAmount: (e) => this.setState({ amount: e.target.value }),
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
