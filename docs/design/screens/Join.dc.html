<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Join a group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--pos:#0A7A4F;--pos-bg:#E2F4EB;--neg:#BF3F0B;--neg-bg:#FCECE3;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--pos:#4BDB98;--pos-bg:#0F2A1E;--neg:#FF9568;--neg-bg:#2D1911}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:12px;min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface2)}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.icon-btn:hover{background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;width:100%}
.input::placeholder{color:var(--muted)}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.who{font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;min-height:48px;padding:0 16px 0 6px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;font-weight:500}
[dir=rtl] .who{padding:0 6px 0 16px}
.who:hover{border-color:var(--muted)}
.who.on{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.codebox{width:52px;height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:600}
.btn:focus-visible,.icon-btn:focus-visible,.who:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="min-height: 920px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 32px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true" style="flex: none"><rect width="48" height="48" rx="13" fill="#C6F135"/><g transform="rotate(-12 24 24)"><rect x="8.5" y="14" width="31" height="20" rx="5.5" fill="none" stroke="#0E1116" stroke-width="3"/><path d="M17 24.2l4.6 4.6 9.4-9.6" fill="none" stroke="#0E1116" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <span style="font-size: 20px; font-weight: 700">{{t.brand}}</span>
    </a>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 16px 32px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <section class="card" style="flex: 999 1 520px; min-width: 0; padding: 36px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 48px; height: 48px; border-radius: 999px; background: #C6F135; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px">{{t.alonI}}</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; color: var(--muted)">{{t.invitedBy}}</span>
          <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.title}}</h1>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 20px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--line)">
        <span style="width: 64px; height: 64px; border-radius: 18px; background: #9CC8FF; color: #0E1116; display: inline-flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        <div style="flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 22px; font-weight: 600">{{t.group}}</span>
          <span style="font-size: 15px; color: var(--muted)">{{t.groupMeta}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <span style="font-size: 13px; color: var(--muted)">{{t.spent}}</span>
          <span style="font-size: 22px; font-weight: 700">₪10,000</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 16px; font-weight: 600">{{t.whoAreYou}}</span>
        <span style="font-size: 14px; color: var(--muted); margin-top: -6px">{{t.whoHint}}</span>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
            <button class="who {{p.on}}" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}">
              <span style="width: 36px; height: 36px; border-radius: 999px; background: {{p.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{p.i}}</span>
              {{p.name}}
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line)">
        <a class="btn btn-primary" href="Group.dc.html" style="min-height: 54px; font-size: 16px">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: #0E1116; color: #C6F135; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">G</span>
          {{joinGoogle}}
        </a>
        <a class="btn btn-ghost" href="Group.dc.html" style="min-height: 54px; font-size: 16px">{{joinGuest}}</a>
        <span style="font-size: 13px; color: var(--muted); text-align: center">{{t.guestNote}}</span>
      </div>
    </section>

    <aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div class="card" style="padding: 28px; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 600">{{t.codeTitle}}</h2>
        <p style="margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5">{{t.codeSub}}</p>
        <div dir="ltr" style="display: flex; gap: 6px; align-items: center; justify-content: center">
          <span class="codebox">K</span><span class="codebox">R</span><span class="codebox">7</span>
          <span style="width: 10px; height: 2px; background: var(--muted)"></span>
          <span class="codebox">4</span><span class="codebox" style="border-color: var(--ink)">Q</span><span class="codebox" style="color: var(--muted)"></span>
        </div>
        <button class="btn btn-ghost">{{t.find}}</button>
      </div>
      <div class="card" style="padding: 24px; display: flex; align-items: center; gap: 16px">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: var(--surface2); display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600">{{t.scan}}</span>
          <span style="font-size: 14px; color: var(--muted)">{{t.scanSub}}</span>
        </div>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    const T = {
      he: {
        brand: 'שולם', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', alonI: 'א',
        invitedBy: 'אלון הזמין אותך להצטרף', title: 'הצטרפות לקבוצה', group: 'טיול לכרתים', groupMeta: '12–18 באוקטובר · 4 חברים · 6 הוצאות', spent: 'הוצאו עד עכשיו',
        whoAreYou: 'מי מהם את/ה?', whoHint: 'אלון כבר הוסיף אותך בשם — בחר/י את עצמך כדי לקבל את ההוצאות שלך.',
        joinGoogleAs: 'הצטרפות עם Google בתור ', joinGuestAs: 'הצטרפות כאורח בתור ', newPerson: 'אני מישהו חדש', someone: 'משתתף חדש',
        guestNote: 'בלי סיסמאות ובלי הרשמה. אפשר לקשר חשבון בהמשך.',
        codeTitle: 'יש לך קוד?', codeSub: 'הקלידו את הקוד בן 6 התווים שקיבלתם מחבר בקבוצה.', find: 'חיפוש קבוצה',
        scan: 'סריקת קוד QR', scanSub: 'מהמסך של חבר, ישר לקבוצה'
      },
      en: {
        brand: 'Settled', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', alonI: 'A',
        invitedBy: 'Alon invited you to join', title: 'Join the group', group: 'Crete trip', groupMeta: 'Oct 12–18 · 4 members · 6 expenses', spent: 'Spent so far',
        whoAreYou: 'Which one is you?', whoHint: 'Alon already added you by name — pick yourself to claim your expenses.',
        joinGoogleAs: 'Join with Google as ', joinGuestAs: 'Join as a guest as ', newPerson: 'I’m someone new', someone: 'a new member',
        guestNote: 'No passwords, no sign-up. You can link an account later.',
        codeTitle: 'Have a code?', codeSub: 'Type the 6-character code a friend in the group sent you.', find: 'Find group',
        scan: 'Scan a QR code', scanSub: 'From a friend’s screen, straight in'
      }
    };
    const t = he ? T.he : T.en;
    const list = he
      ? [{ name: 'נועה', i: 'נ', c: '#FFB59A' }, { name: 'איתי', i: 'א', c: '#9CC8FF' }, { name: 'מאיה', i: 'מ', c: '#E2B6FF' }, { name: t.newPerson, i: '+', c: '#D5D9E0' }]
      : [{ name: 'Noa', i: 'N', c: '#FFB59A' }, { name: 'Itay', i: 'I', c: '#9CC8FF' }, { name: 'Maya', i: 'M', c: '#E2B6FF' }, { name: t.newPerson, i: '+', c: '#D5D9E0' }];
    const sel = s.sel ?? 0;
    const people = list.map((p, i) => ({ ...p, on: i === sel ? 'on' : '', pressed: i === sel ? 'true' : 'false', pick: () => this.setState({ sel: i }) }));
    const who = sel === 3 ? t.someone : list[sel].name;
    return {
      t, people,
      joinGoogle: t.joinGoogleAs + who, joinGuest: t.joinGuestAs + who,
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
