<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Loading — skeleton</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--sk1:#E9EBEF;--sk2:#F5F6F8;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--sk1:#1C2027;--sk2:#262B33}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 40%,var(--sk1) 60%);background-size:300% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;font-weight:500;color:var(--muted)}
.nav a.on{color:var(--ink);background:var(--surface2)}
.icon-btn:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="min-height: 1080px" aria-busy="true">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: var(--surface)">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true" style="flex: none"><rect width="48" height="48" rx="13" fill="#C6F135"/><g transform="rotate(-12 24 24)"><rect x="8.5" y="14" width="31" height="20" rx="5.5" fill="none" stroke="#0E1116" stroke-width="3"/><path d="M17 24.2l4.6 4.6 9.4-9.6" fill="none" stroke="#0E1116" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <span style="font-size: 20px; font-weight: 700">{{t.brand}}</span>
    </a>
    <nav class="nav" style="display: flex; gap: 4px; flex-wrap: wrap">
      <a class="on" href="Home.dc.html">{{t.navGroups}}</a>
      <a href="Activity.dc.html">{{t.navActivity}}</a>
      <a href="Settings.dc.html">{{t.navSettings}}</a>
    </nav>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
    <span class="sk" style="width: 44px; height: 44px; border-radius: 999px"></span>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 56px; display: flex; flex-direction: column; gap: 32px">
    <span role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.loading}}</span>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span class="sk" style="width: 160px; height: 14px"></span>
        <span class="sk" style="width: 240px; height: 38px; border-radius: 10px"></span>
      </div>
      <div style="display: flex; gap: 10px">
        <span class="sk" style="width: 150px; height: 44px; border-radius: 12px"></span>
        <span class="sk" style="width: 140px; height: 44px; border-radius: 12px"></span>
      </div>
    </div>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
      <sc-for list="{{three}}" as="x" hint-placeholder-count="3">
        <div class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
          <span class="sk" style="width: 45%; height: 14px"></span>
          <span class="sk" style="width: 60%; height: 40px; border-radius: 10px"></span>
          <span class="sk" style="width: 70%; height: 12px"></span>
        </div>
      </sc-for>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <span class="sk" style="width: 140px; height: 22px"></span>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px">
          <sc-for list="{{four}}" as="x" hint-placeholder-count="4">
            <div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 18px">
              <div style="display: flex; align-items: center; gap: 14px">
                <span class="sk" style="width: 48px; height: 48px; border-radius: 14px; flex: none"></span>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span class="sk" style="width: 60%; height: 16px"></span><span class="sk" style="width: 40%; height: 12px"></span></div>
              </div>
              <div style="display: flex; gap: 6px"><span class="sk" style="width: 30px; height: 30px; border-radius: 999px"></span><span class="sk" style="width: 30px; height: 30px; border-radius: 999px"></span><span class="sk" style="width: 30px; height: 30px; border-radius: 999px"></span></div>
              <div style="display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--line)"><span class="sk" style="width: 90px; height: 22px"></span><span class="sk" style="width: 60px; height: 12px"></span></div>
            </div>
          </sc-for>
        </div>
      </section>
      <aside style="flex: 1 1 320px; min-width: 0" class="card">
        <div style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
          <span class="sk" style="width: 50%; height: 18px"></span>
          <sc-for list="{{four}}" as="x" hint-placeholder-count="4">
            <div style="display: flex; gap: 12px; align-items: center"><span class="sk" style="width: 36px; height: 36px; border-radius: 999px; flex: none"></span><div style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span class="sk" style="width: 85%; height: 12px"></span><span class="sk" style="width: 40%; height: 10px"></span></div></div>
          </sc-for>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    const t = he
      ? { brand: 'שולם', navGroups: 'קבוצות', navActivity: 'פעילות', navSettings: 'הגדרות', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', loading: 'טוען את הקבוצות שלך' }
      : { brand: 'Settled', navGroups: 'Groups', navActivity: 'Activity', navSettings: 'Settings', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', loading: 'Loading your groups' };
    return {
      t, three: [1, 2, 3], four: [1, 2, 3, 4],
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
