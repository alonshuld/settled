<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Loading — splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--stamp:#0E1116;--track:#E2E5EA;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--stamp:#C6F135;--track:#262B33}
.app *{box-sizing:border-box}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes thump{0%{transform:rotate(-8deg) scale(2.2);opacity:0}16%{transform:rotate(-8deg) scale(.92);opacity:1}24%{transform:rotate(-8deg) scale(1.03)}30%,82%{transform:rotate(-8deg) scale(1);opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:0}}
@keyframes ring{0%,14%{transform:scale(.7);opacity:0}18%{opacity:.5}45%,100%{transform:scale(1.5);opacity:0}}
@keyframes slide{0%{inset-inline-start:-40%}100%{inset-inline-start:100%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stamp{animation:thump 2.6s cubic-bezier(.2,.9,.3,1) infinite}
.ring{animation:ring 2.6s ease-out infinite}
.bar{position:absolute;top:0;bottom:0;width:40%;border-radius:999px;background:#C6F135;animation:slide 1.3s ease-in-out infinite}
.msg{animation:fadeUp .4s ease both}
@media (prefers-reduced-motion: reduce){.stamp,.ring,.bar{animation:none}.stamp{transform:rotate(-8deg)}}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="min-height: 900px; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 20px 32px">
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>
  <div role="status" aria-live="polite" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 32px">
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 420px; max-width: 100%; height: 220px">
      <span class="ring" style="position: absolute; width: 300px; height: 150px; border-radius: 40px; border: 3px solid var(--stamp)"></span>
      <div class="stamp" style="border: 7px solid var(--stamp); color: var(--stamp); border-radius: 26px; padding: 12px 34px 16px; font-size: 92px; line-height: 1; font-weight: 800; display: flex; align-items: center; gap: 14px; letter-spacing: -0.01em">{{t.stamp}}<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; width: 280px; max-width: 100%">
      <span class="msg" style="font-size: 18px; font-weight: 500; color: var(--muted)">{{msg}}</span>
      <span style="position: relative; width: 100%; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden"><span class="bar"></span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() { this._t = setInterval(() => this.setState({ i: ((this.state && this.state.i) || 0) + 1 }), 1800); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : (this.props.dark ?? true);
    const he = lang === 'he';
    const msgs = he ? ['מעלים את הקבוצות…', 'עושים את החשבון…', 'מפשטים חובות…', 'כמעט שם…'] : ['Loading your groups…', 'Doing the math…', 'Simplifying debts…', 'Almost there…'];
    return {
      t: he ? { stamp: 'שולם', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה' } : { stamp: 'Settled', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme' },
      msg: msgs[(s.i || 0) % msgs.length],
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
