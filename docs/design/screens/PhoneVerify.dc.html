<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Phone — email or phone sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--neg:#BF3F0B;--neg-bg:#FCECE3;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--neg:#FF9568;--neg-bg:#2D1911}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.seg{font:inherit;font-size:15px;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:10px;min-height:44px;cursor:pointer;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:56px;padding:0 16px;width:100%}
.input::placeholder{color:var(--muted)}
.otp{font:inherit;width:48px;height:58px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;font-size:24px;font-weight:600}
.otp.err{border-color:var(--neg);background:var(--neg-bg)}
.cta{font:inherit;min-height:56px;width:100%;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px;cursor:pointer}
.spin{width:20px;height:20px;border-radius:999px;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.icon-btn:focus-visible,.seg:focus-visible,.cta:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 0">
    <sc-if value="{{isEnter}}" hint-placeholder-val="{{true}}"><a class="icon-btn" href="PhoneLogin.dc.html" aria-label="{{t.back}}"><svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a></sc-if>
    <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}"><button class="icon-btn" onClick="{{back}}" aria-label="{{t.back}}"><svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></sc-if>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>

  <sc-if value="{{isEnter}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; flex-direction: column; padding: 24px 20px 30px; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.title}}</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted)">{{t.sub}}</p>
      </div>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line)">
        <button class="seg {{mEmail}}" onClick="{{useEmail}}" aria-pressed="{{pEmail}}">{{t.email}}</button>
        <button class="seg {{mPhone}}" onClick="{{usePhone}}" aria-pressed="{{pPhone}}">{{t.phone}}</button>
      </div>
      <sc-if value="{{isEmail}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="ve" style="font-size: 14px; font-weight: 500; color: var(--muted)">{{t.emailLabel}}</label><input id="ve" class="input" type="email" dir="ltr" value="alon@example.com"></div>
      </sc-if>
      <sc-if value="{{isPhone}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="vp" style="font-size: 14px; font-weight: 500; color: var(--muted)">{{t.phoneLabel}}</label>
          <div dir="ltr" style="display: flex; gap: 8px"><span style="min-height: 56px; padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; font-weight: 500">+972</span><input id="vp" class="input" type="tel" value="50-123-4567"></div>
        </div>
      </sc-if>
      <div style="flex: 1"></div>
      <span style="font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5">{{t.terms}}</span>
      <button class="cta" onClick="{{send}}" aria-busy="{{busyAttr}}">
        <sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><span class="spin" aria-hidden="true"></span>{{t.sending}}</sc-if>
        <sc-if value="{{notBusy}}" hint-placeholder-val="{{true}}">{{t.send}}</sc-if>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; padding: 24px 20px 30px; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.codeTitle}}</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted)">{{codeSub}} <bdi dir="ltr" style="color: var(--ink); font-weight: 600">{{target}}</bdi></p>
      </div>
      <div dir="ltr" style="display: flex; justify-content: space-between">
        <sc-for list="{{digits}}" as="d" hint-placeholder-count="6"><input class="otp {{d.err}}" inputmode="numeric" maxlength="1" value="{{d.v}}" aria-label="{{d.label}}"></sc-for>
      </div>
      <sc-if value="{{codeError}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--neg-bg); color: var(--neg); font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>{{t.wrong}}</div>
      </sc-if>
      <span style="font-size: 14px; color: var(--muted); text-align: center">{{t.noCode}} <strong style="color: var(--ink)">{{t.resend}} <bdi dir="ltr">0:42</bdi></strong></span>
      <div style="flex: 1"></div>
      <sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><div class="cta" aria-busy="true"><span class="spin" aria-hidden="true"></span>{{t.verifying}}</div></sc-if>
      <sc-if value="{{showVerify}}" hint-placeholder-val="{{true}}"><button class="cta" onClick="{{verify}}">{{t.verify}}</button></sc-if>
      <sc-if value="{{ok}}" hint-placeholder-val="{{false}}"><a class="cta" href="PhoneSplash.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{t.inLabel}}</a></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":false},"step":{"editor":"enum","options":["enter","code","codeError"],"default":"code"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    const ps = this.props.step || 'code';
    const step = s.step || (ps === 'codeError' ? 'code' : ps);
    const codeError = s.codeError != null ? s.codeError : ps === 'codeError';
    const method = s.method || 'phone';
    const T = {
      he: { langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', back: 'חזרה',
        title: 'כניסה בלי סיסמה', sub: 'נשלח לך קוד חד־פעמי — וזהו, נכנסת.', email: 'אימייל', phone: 'טלפון',
        emailLabel: 'כתובת אימייל', phoneLabel: 'מספר נייד', terms: 'בהמשך את/ה מאשר/ת את תנאי השימוש ומדיניות הפרטיות.',
        send: 'שלחו לי קוד', sending: 'שולחים…',
        codeTitle: 'מה הקוד?', subPhone: 'שלחנו SMS אל', subEmail: 'שלחנו קוד אל', wrong: 'הקוד לא נכון. נשארו 2 ניסיונות.',
        noCode: 'לא הגיע?', resend: 'שליחה חוזרת בעוד', verify: 'כניסה', verifying: 'בודקים…', digit: 'ספרה ', inLabel: 'נכנסת — ממשיכים' },
      en: { langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', back: 'Back',
        title: 'Sign in, no password', sub: 'We’ll send a one-time code — that’s it, you’re in.', email: 'Email', phone: 'Phone',
        emailLabel: 'Email address', phoneLabel: 'Mobile number', terms: 'By continuing you agree to the Terms and Privacy Policy.',
        send: 'Send me a code', sending: 'Sending…',
        codeTitle: 'What’s the code?', subPhone: 'We texted it to', subEmail: 'We sent it to', wrong: 'Wrong code. 2 tries left.',
        noCode: 'Didn’t get it?', resend: 'Resend in', verify: 'Sign in', verifying: 'Checking…', digit: 'Digit ', inLabel: 'You’re in — continue' }
    };
    const t = he ? T.he : T.en;
    const vals = ['4', '8', '2', '9', codeError ? '1' : '', codeError ? '7' : ''];
    const busy = !!s.busy;
    return {
      t, codeError, busy, notBusy: !busy, busyAttr: busy ? 'true' : 'false',
      isEnter: step === 'enter', isCode: step === 'code',
      isEmail: method === 'email', isPhone: method === 'phone',
      mEmail: method === 'email' ? 'on' : '', mPhone: method === 'phone' ? 'on' : '',
      pEmail: method === 'email' ? 'true' : 'false', pPhone: method === 'phone' ? 'true' : 'false',
      useEmail: () => this.setState({ method: 'email' }), usePhone: () => this.setState({ method: 'phone' }),
      codeSub: method === 'email' ? t.subEmail : t.subPhone,
      target: method === 'email' ? 'alon@example.com' : '+972 50-•••-4567',
      digits: vals.map((v, i) => ({ v, err: codeError ? 'err' : '', label: t.digit + (i + 1) })),
      send: () => { if (busy) return; this.setState({ busy: true }); setTimeout(() => this.setState({ busy: false, step: 'code', codeError: false }), 1100); },
      verify: () => { const first = !s.tried && !codeError; this.setState({ busy: true }); setTimeout(() => this.setState(first ? { busy: false, codeError: true, tried: true } : { busy: false, codeError: false, ok: true }), 1100); },
      ok: !busy && !!s.ok, showVerify: !busy && !s.ok,
      back: () => this.setState({ step: 'enter', codeError: false }),
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
