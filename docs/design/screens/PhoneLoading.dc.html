<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — loading skeleton</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--sk1:#E9EBEF;--sk2:#F5F6F8;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--sk1:#1C2027;--sk2:#262B33}
.app *{box-sizing:border-box}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 40%,var(--sk1) 60%);background-size:300% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" aria-busy="true" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 0">
    <span role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.loading}}</span>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span class="sk" style="width: 110px; height: 12px"></span><span class="sk" style="width: 150px; height: 26px"></span></div>
      <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
      <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
        <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
        <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      </button>
    </div>
    <div style="border-radius: 24px; background: var(--surface); border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span class="sk" style="width: 40%; height: 12px"></span>
      <span class="sk" style="width: 55%; height: 38px; border-radius: 10px"></span>
      <div style="display: flex; gap: 10px"><span class="sk" style="flex: 1; height: 52px; border-radius: 14px"></span><span class="sk" style="flex: 1; height: 52px; border-radius: 14px"></span></div>
    </div>
    <span class="sk" style="width: 120px; height: 18px"></span>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
          <span class="sk" style="width: 44px; height: 44px; border-radius: 13px; flex: none"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span class="sk" style="width: 65%; height: 14px"></span><span class="sk" style="width: 40%; height: 10px"></span></span>
          <span class="sk" style="width: 56px; height: 18px"></span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; justify-content: space-around; align-items: center; padding: 12px 24px 30px; background: var(--surface); border-top: 1px solid var(--line)">
    <span class="sk" style="width: 26px; height: 26px; border-radius: 8px"></span><span class="sk" style="width: 26px; height: 26px; border-radius: 8px"></span><span class="sk" style="width: 56px; height: 56px; border-radius: 18px"></span><span class="sk" style="width: 26px; height: 26px; border-radius: 8px"></span><span class="sk" style="width: 26px; height: 26px; border-radius: 8px"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"en"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'en';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    return {
      t: he ? { loading: 'טוען את הקבוצות שלך', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה' } : { loading: 'Loading your groups', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme' },
      rows: [1, 2, 3, 4, 5],
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
