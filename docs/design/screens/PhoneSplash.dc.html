<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Phone — splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#C6F135;--ink:#0E1116;--sub:#2B3410;--btn:rgba(14,17,22,.12);font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app.dark{--bg:#0E1116;--ink:#C6F135;--sub:#AEB5C0;--btn:rgba(198,241,53,.12)}
.app *{box-sizing:border-box}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:0;background:var(--btn);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes thump{0%{transform:rotate(-8deg) scale(2.2);opacity:0}16%{transform:rotate(-8deg) scale(.92);opacity:1}24%{transform:rotate(-8deg) scale(1.03)}30%,82%{transform:rotate(-8deg) scale(1);opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:0}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.stamp{animation:thump 2.6s cubic-bezier(.2,.9,.3,1) infinite}
.d{width:8px;height:8px;border-radius:999px;background:var(--ink);animation:dot 1.2s ease-in-out infinite}
.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@media (prefers-reduced-motion: reduce){.stamp,.d{animation:none}.stamp{transform:rotate(-8deg)}}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 52px 16px 0">
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>
  <div role="status" aria-live="polite" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px">
    <div class="stamp" style="border: 6px solid var(--ink); color: var(--ink); border-radius: 22px; padding: 8px 24px 12px; font-size: 60px; line-height: 1; font-weight: 800; display: flex; align-items: center; gap: 10px">{{t.stamp}}<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <span style="font-size: 16px; font-weight: 500; color: var(--sub)">{{msg}}</span>
  </div>
  <div aria-hidden="true" style="display: flex; justify-content: center; gap: 8px; padding-bottom: 56px"><span class="d"></span><span class="d d2"></span><span class="d d3"></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"he"},"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this._t = setInterval(() => this.setState({ i: ((this.state && this.state.i) || 0) + 1 }), 1800); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'he';
    const dark = s.dark != null ? s.dark : (this.props.dark ?? true);
    const he = lang === 'he';
    const msgs = he ? ['מעלים את הקבוצות…', 'עושים את החשבון…', 'כמעט שם…'] : ['Loading your groups…', 'Doing the math…', 'Almost there…'];
    return {
      t: he ? { stamp: 'שולם', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה' } : { stamp: 'Settled', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme' },
      msg: msgs[(s.i || 0) % msgs.length],
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
