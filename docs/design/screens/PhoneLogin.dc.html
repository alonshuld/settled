<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;min-height:54px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:52px;padding:0 16px;width:100%}
.input::placeholder{color:var(--muted)}
.btn:focus-visible,.icon-btn:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 20px 0">
    <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true" style="flex: none"><rect width="48" height="48" rx="13" fill="#C6F135"/><g transform="rotate(-12 24 24)"><rect x="8.5" y="14" width="31" height="20" rx="5.5" fill="none" stroke="#0E1116" stroke-width="3"/><path d="M17 24.2l4.6 4.6 9.4-9.6" fill="none" stroke="#0E1116" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
    <span style="font-size: 19px; font-weight: 700">{{t.brand}}</span>
    <div style="flex: 1"></div>
    <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
    <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
    </button>
  </div>

  <div style="margin: 24px 20px 0; height: 240px; border-radius: 28px; background: #0E1116; border: 1px solid #262B33; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; gap: 8px">
    <div style="position: absolute; top: 20px; inset-inline-start: 18px; inset-inline-end: 18px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{demo}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #1C2128; color: #F2F3F5">
          <span style="width: 28px; height: 28px; border-radius: 999px; background: {{r.c}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">{{r.i}}</span>
          <span style="flex: 1; font-size: 13px; color: #C9CED6">{{r.label}}</span>
          <span style="font-weight: 600; font-size: 14px">{{r.amount}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; bottom: 18px; inset-inline-end: 16px; transform: rotate(-9deg); border: 3px solid #C6F135; color: #C6F135; border-radius: 12px; padding: 4px 14px; font-size: 24px; font-weight: 800; background: #0E1116; display: flex; align-items: center; gap: 6px">{{t.stamp}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>

  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">{{t.h1}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted)">{{t.sub}}</p>
  </div>

  <div style="flex: 1"></div>

  <div style="padding: 0 20px 34px; display: flex; flex-direction: column; gap: 12px">
    <a class="btn btn-ghost" href="PhoneHome.dc.html"><span style="width: 24px; height: 24px; border-radius: 999px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">G</span>{{t.google}}</a>
    <a class="btn btn-primary" href="PhoneVerify.dc.html"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>{{t.emailPhone}}</a>
    <a class="btn" href="PhoneHome.dc.html" style="background: transparent; color: var(--muted); min-height: 46px; font-weight: 500">{{t.guest}}</a>
    <span style="text-align: center; font-size: 13px; color: var(--muted)">{{t.code}} <a href="Join.dc.html" style="color: var(--ink); font-weight: 600; text-decoration: underline">{{t.join}}</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"en"},"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'en';
    const dark = s.dark != null ? s.dark : (this.props.dark ?? true);
    const he = lang === 'he';
    const T = {
      he: { brand: 'שולם', langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה', stamp: 'שולם',
        h1: 'כל אחד שילם על משהו. אנחנו נעשה את החשבון.', sub: 'קבוצה לכל אירוע, ותמיד יודעים מי חייב למי.',
        google: 'המשך עם Google', emailPhone: 'המשך עם אימייל או טלפון', guestPh: 'השם שלך', guest: 'המשך כאורח', code: 'יש לך קוד הזמנה?', join: 'הצטרפות' },
      en: { brand: 'Settled', langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme', stamp: 'Settled',
        h1: 'Everyone paid for something. We’ll do the math.', sub: 'A group for every occasion — always know who owes whom.',
        google: 'Continue with Google', emailPhone: 'Continue with email or phone', guestPh: 'Your name', guest: 'Continue as guest', code: 'Got an invite code?', join: 'Join a group' }
    };
    const demo = he
      ? [{ i: 'נ', c: '#FFB59A', label: 'נועה ← אלון', amount: '₪900' }, { i: 'א', c: '#9CC8FF', label: 'איתי ← אלון', amount: '₪900' }, { i: 'מ', c: '#E2B6FF', label: 'מאיה ← אלון', amount: '₪500' }]
      : [{ i: 'N', c: '#FFB59A', label: 'Noa pays Alon', amount: '₪900' }, { i: 'I', c: '#9CC8FF', label: 'Itay pays Alon', amount: '₪900' }, { i: 'M', c: '#E2B6FF', label: 'Maya pays Alon', amount: '₪500' }];
    return {
      t: he ? T.he : T.en, demo,
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
