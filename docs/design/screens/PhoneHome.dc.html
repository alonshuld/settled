<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — my groups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F6F7F9;--line:#E2E5EA;--ink:#0E1116;--muted:#596170;--accent:#C6F135;--accent-ink:#0E1116;--pos:#0A7A4F;--pos-bg:#E2F4EB;--neg:#BF3F0B;--neg-bg:#FCECE3;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.app.dark{--bg:#0A0C0F;--surface:#13161B;--surface2:#1A1E24;--line:#262B33;--ink:#EDEFF2;--muted:#9AA2AE;--pos:#4BDB98;--pos-bg:#0F2A1E;--neg:#FF9568;--neg-bg:#2D1911}
.app *{box-sizing:border-box}
.app a{text-decoration:none}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:11px;font-weight:500;color:var(--muted)}
.tabbar a.on{color:var(--ink)}
.icon-btn:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="app {{theme}}" dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; position: relative">
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: var(--muted)">{{t.date}}</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">{{t.hello}}</h1>
      </div>
      <button class="icon-btn" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}">{{t.langShort}}</button>
      <button class="icon-btn" onClick="{{toggleDark}}" aria-label="{{t.themeLabel}}">
        <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
        <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      </button>
    </div>

    <div style="border-radius: 24px; background: #0E1116; color: #F2F3F5; border: 1px solid #262B33; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 14px; color: #AEB5C0">{{t.net}}</span>
      <span style="font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: #C6F135">+₪1,580</span>
      <div style="display: flex; gap: 10px">
        <span style="flex: 1; padding: 10px 12px; border-radius: 14px; background: #1C2128; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #AEB5C0">{{t.owed}}</span><span style="font-weight: 600; color: #4BDB98">₪1,920</span></span>
        <span style="flex: 1; padding: 10px 12px; border-radius: 14px; background: #1C2128; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #AEB5C0">{{t.owe}}</span><span style="font-weight: 600; color: #FF9568">₪340</span></span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--neg-bg)">
      <span style="width: 36px; height: 36px; border-radius: 999px; background: #FFE08A; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{t.roniI}}</span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600; font-size: 15px">{{t.payRoni}}</span><span style="font-size: 12px; color: var(--muted)">{{t.payRoniMeta}}</span></div>
      <a href="PhoneSettle.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center">{{t.pay}}</a>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600">{{t.groups}}</h2>
      <a href="Join.dc.html" style="font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{t.join}}</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: -8px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <a href="PhoneGroup.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
          <span style="width: 44px; height: 44px; border-radius: 13px; background: {{g.tint}}; color: #0E1116; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"/></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 16px">{{g.name}}</span><span style="font-size: 13px; color: var(--muted)">{{g.meta}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
            <span style="font-size: 11px; color: var(--muted)">{{g.label}}</span>
            <span style="font-weight: 700; font-size: 16px; color: {{g.color}}">{{g.amount}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav class="tabbar" style="display: flex; align-items: center; padding: 6px 12px 26px; background: var(--surface); border-top: 1px solid var(--line)">
    <a class="on" href="PhoneHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg>{{t.tGroups}}</a>
    <a href="Activity.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>{{t.tActivity}}</a>
    <a href="PhoneAdd.dc.html" aria-label="{{t.tAdd}}" style="flex: none; width: 60px; height: 60px; min-height: 60px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); margin-top: -26px; box-shadow: 0 8px 20px rgba(0,0,0,.18)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="NewGroup.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>{{t.tNew}}</a>
    <a href="Settings.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>{{t.tMe}}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["he","en"],"default":"en"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.lang || 'en';
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const he = lang === 'he';
    const T = {
      he: { langShort: 'EN', langLabel: 'Switch to English', themeLabel: 'החלפת מצב תצוגה',
        date: 'שבת, 24 באוקטובר', hello: 'היי אלון', net: 'המאזן שלך', owed: 'חייבים לך', owe: 'אתה חייב',
        roniI: 'ר', payRoni: 'להעביר לרוני ₪340', payRoniMeta: 'הדירה · חשבונות אוקטובר', pay: 'תשלום',
        groups: 'הקבוצות שלי', join: 'הצטרפות עם קוד',
        tGroups: 'קבוצות', tActivity: 'פעילות', tAdd: 'הוצאה חדשה', tNew: 'קבוצה', tMe: 'אני' },
      en: { langShort: 'עב', langLabel: 'Switch to Hebrew', themeLabel: 'Toggle theme',
        date: 'Saturday, Oct 24', hello: 'Hey Alon', net: 'Your balance', owed: 'Owed to you', owe: 'You owe',
        roniI: 'R', payRoni: 'Pay Roni ₪340', payRoniMeta: 'The flat · October bills', pay: 'Pay',
        groups: 'My groups', join: 'Join with code',
        tGroups: 'Groups', tActivity: 'Activity', tAdd: 'Add expense', tNew: 'New', tMe: 'Me' }
    };
    const t = he ? T.he : T.en;
    const d = {
      trip: 'M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z',
      home: 'M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6',
      food: 'M5 3v8a2 2 0 0 0 2 2v8M9 3v8M7 3v8M17 21V3c-2 0-3 2-3 5v5h3',
      gift: 'M3 8h18v4H3zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5'
    };
    const pos = 'var(--pos)', neg = 'var(--neg)', mut = 'var(--muted)';
    const groups = he ? [
      { name: 'טיול לכרתים', meta: '4 חברים · לפני שעה', tint: '#9CC8FF', d: d.trip, label: 'חייבים לך', amount: '₪1,800', color: pos },
      { name: 'הדירה', meta: '3 חברים · אתמול', tint: '#FFE08A', d: d.home, label: 'אתה חייב', amount: '₪340', color: neg },
      { name: 'ארוחות שישי', meta: '5 חברים · לפני 3 ימים', tint: '#FFB59A', d: d.food, label: 'חייבים לך', amount: '₪120', color: pos },
      { name: 'מתנה לדנה', meta: '5 חברים · ספטמבר', tint: '#E2B6FF', d: d.gift, label: '', amount: 'שולם ✓', color: mut }
    ] : [
      { name: 'Crete trip', meta: '4 members · 1h ago', tint: '#9CC8FF', d: d.trip, label: 'You’re owed', amount: '₪1,800', color: pos },
      { name: 'The flat', meta: '3 members · Yesterday', tint: '#FFE08A', d: d.home, label: 'You owe', amount: '₪340', color: neg },
      { name: 'Friday dinners', meta: '5 members · 3 days ago', tint: '#FFB59A', d: d.food, label: 'You’re owed', amount: '₪120', color: pos },
      { name: 'Gift for Dana', meta: '5 members · September', tint: '#E2B6FF', d: d.gift, label: '', amount: 'Settled ✓', color: mut }
    ];
    return {
      t, groups,
      dir: he ? 'rtl' : 'ltr', lang,
      theme: dark ? 'dark' : 'light', isDark: dark, isLight: !dark,
      toggleLang: () => this.setState({ lang: he ? 'en' : 'he' }),
      toggleDark: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
