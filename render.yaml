# Render Blueprint: New > Blueprint > pick this repo. Free plan, no paid add-ons.
services:
  - type: web
    name: settled-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Secrets: enter in the Render dashboard (sync: false = prompted, never stored in git)
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: MOBILE_ORIGINS
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
