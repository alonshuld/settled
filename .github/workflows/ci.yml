name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settled
          POSTGRES_PASSWORD: settled
          POSTGRES_DB: settled
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settled" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://settled:settled@localhost:5432/settled
      CRON_SECRET: ci-cron-secret-0123456789
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @settled/api exec prisma migrate deploy
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settled
          POSTGRES_PASSWORD: settled
          POSTGRES_DB: settled
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settled" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://settled:settled@localhost:5432/settled
      CRON_SECRET: ci-cron-secret-0123456789
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @settled/api exec prisma migrate deploy
      - run: pnpm --filter @settled/web exec playwright install --with-deps chromium
      # Smoke test uses guest sign-in only, so no Mailpit/R2/Google needed
      - name: Start API
        run: |
          pnpm --filter @settled/api start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3001/readyz && exit 0; sleep 2; done
          cat api.log; exit 1
      - run: pnpm --filter @settled/web test:e2e
      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
